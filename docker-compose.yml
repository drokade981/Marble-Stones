services:
  # 1. Laravel Web Application & API
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: slaberp-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "SlabERP"
      APP_ENV: local
      APP_KEY: base64:a0B1c2D3e4F5g6H7i8J9k0L1m2N3o4P5q6R7s8T9u0V=
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      LOG_CHANNEL: stack
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: laravel_erp
      DB_USERNAME: root
      DB_PASSWORD: root_secret
      BROADCAST_CONNECTION: log
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: ${REDIS_CLIENT:-predis}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TS_AGENT_URL: http://ts-agent:3001
      PHP_CLI_SERVER_WORKERS: "4"
    volumes:
      - .:/var/www/html
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 2. MySQL 8.0 Database (Replaced PostgreSQL)
  database:
    image: mysql:8.0
    container_name: slaberp-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel_erp
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 3. Redis Cache & Queues
  redis:
    image: redis:7-alpine
    container_name: slaberp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. Laravel Queue Worker
  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: slaberp-queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--verbose", "--tries=3", "--timeout=90"]
    environment:
      APP_NAME: "SlabERP"
      APP_ENV: local
      APP_KEY: base64:a0B1c2D3e4F5g6H7i8J9k0L1m2N3o4P5q6R7s8T9u0V=
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: laravel_erp
      DB_USERNAME: root
      DB_PASSWORD: root_secret
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: ${REDIS_CLIENT:-predis}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
    volumes:
      - .:/var/www/html
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started

  # 5. Standalone TypeScript AI Agent Microservice
  ts-agent:
    build:
      context: ./ts-agent
      dockerfile: Dockerfile
    container_name: slaberp-ts-agent
    restart: unless-stopped
    command: ["npm", "run", "dev"]
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      LARAVEL_API_URL: http://app:8000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
    volumes:
      - ./ts-agent/src:/app/src
      - ./ts-agent/package.json:/app/package.json
      - ./ts-agent/tsconfig.json:/app/tsconfig.json
    depends_on:
      - app

volumes:
  mysql_data:
    driver: local
